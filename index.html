
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Shop</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#20243a}
header{background:#4338ca;color:white;padding:22px 6%;display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{margin:0;font-size:25px}
.cart-btn,.buy{border:0;border-radius:8px;padding:12px 17px;cursor:pointer;font-weight:bold}
.cart-btn{background:white;color:#4338ca}
main{max-width:1100px;margin:35px auto;padding:0 18px}
.intro{text-align:center;margin-bottom:30px}
.intro p{color:#666}
.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.card{background:white;border-radius:15px;padding:22px;text-align:center;box-shadow:0 5px 20px #20243a10;transition:transform .2s}
.card:hover{transform:translateY(-5px)}
.product-icon{font-size:65px;background:#eef2ff;padding:20px;border-radius:12px}
.card h3{margin-bottom:8px}
.price{font-size:22px;font-weight:bold;color:#4338ca;margin:15px}
.buy{background:#4338ca;color:white;width:100%}
.buy:hover{background:#312e81}
#message{text-align:center;min-height:24px;margin:20px}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:18px;z-index:5}
.modal.show{display:flex}
.modal-box{background:white;color:#20243a;border-radius:16px;padding:25px;width:100%;max-width:450px;max-height:85vh;overflow:auto}
.modal-box h2{margin-top:0}
.cart-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #ddd}
.remove{border:0;background:#fee2e2;color:#991b1b;padding:7px;border-radius:6px;cursor:pointer}
.total{font-size:21px;font-weight:bold;text-align:right;margin:20px 0}
.actions{display:flex;gap:10px}
.actions button{flex:1}
.close{background:#e5e7eb;color:#222}
.empty{text-align:center;color:#777;padding:20px}
@media(max-width:700px){.products{grid-template-columns:repeat(2,minmax(0,1fr))}header h1{font-size:20px}}
@media(max-width:450px){.products{grid-template-columns:1fr}header{padding:18px 4%}.product-icon{font-size:50px}}
</style>
</head>
<body>

<header>
  <h1>🛍️ Mini Shop</h1>
  <button class="cart-btn" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button>
</header>

<main>
  <section class="intro">
    <h2>Find Your Favorites</h2>
    <p>Simple products. Great choices.</p>
  </section>
  <section class="products" id="products"></section>
  <p id="message" aria-live="polite"></p>
</main>

<div class="modal" id="cartModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">
    <h2 id="modalTitle">Your Shopping Cart</h2>
    <div id="cartItems"></div>
    <div class="total" id="total">Total: ₹0</div>
    <div class="actions">
      <button class="buy close" onclick="closeCart()">Continue Shopping</button>
      <button class="buy" onclick="checkout()">Checkout</button>
    </div>
  </div>
</div>

<div class="modal" id="checkoutModal" role="dialog" aria-modal="true" aria-labelledby="checkoutTitle">
  <div class="modal-box">
    <h2 id="checkoutTitle">Checkout Preview</h2>
    <p>Your order summary:</p>
    <div id="preview"></div>
    <div class="total" id="previewTotal"></div>
    <p style="color:#666;font-size:14px">This is a demo checkout. No payment will be collected.</p>
    <button class="buy" style="margin-bottom:10px" onclick="finishOrder()">Confirm Demo Order</button>
    <button class="buy close" onclick="closeCheckout()">Back to Cart</button>
  </div>
</div>

<script>
const products = [
  {id:1,name:"Wireless Headphones",price:1499,icon:"🎧",desc:"Enjoy your favorite music."},
  {id:2,name:"Smart Watch",price:2199,icon:"⌚",desc:"Stay connected every day."},
  {id:3,name:"Running Shoes",price:1799,icon:"👟",desc:"Comfort for every step."},
  {id:4,name:"Backpack",price:999,icon:"🎒",desc:"Carry your essentials."},
  {id:5,name:"Camera",price:3499,icon:"📷",desc:"Capture special moments."},
  {id:6,name:"Coffee Mug",price:299,icon:"☕",desc:"Make every break better."}
];

let cart = [];

const money = amount => "₹" + amount.toLocaleString("en-IN");

function renderProducts(){
  const container = document.getElementById("products");
  container.replaceChildren();

  products.forEach(product => {
    const card = document.createElement("article");
    card.className = "card";

    const icon = document.createElement("div");
    icon.className = "product-icon";
    icon.textContent = product.icon;

    const title = document.createElement("h3");
    title.textContent = product.name;

    const desc = document.createElement("p");
    desc.textContent = product.desc;

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = money(product.price);

    const button = document.createElement("button");
    button.className = "buy";
    button.textContent = "Add to Cart";
    button.onclick = () => addToCart(product.id);

    card.append(icon,title,desc,price,button);
    container.append(card);
  });
}

function addToCart(id){
  const item = cart.find(product => product.id === id);

  if(item){
    item.quantity++;
  }else{
    const product = products.find(product => product.id === id);
    cart.push({...product,quantity:1});
  }

  updateCount();
  document.getElementById("message").textContent =
    "Product added to cart successfully!";
}

function updateCount(){
  const count = cart.reduce((sum,item) => sum + item.quantity,0);
  document.getElementById("count").textContent = count;
}

function cartTotal(){
  return cart.reduce((sum,item) => sum + item.price * item.quantity,0);
}

function renderCart(){
  const container = document.getElementById("cartItems");
  container.replaceChildren();

  if(cart.length === 0){
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "Your cart is empty.";
    container.append(empty);
  }

  cart.forEach(item => {
    const line = document.createElement("div");
    line.className = "cart-line";

    const info = document.createElement("span");
    info.textContent =
      `${item.icon} ${item.name} × ${item.quantity} — ${money(item.price * item.quantity)}`;

    const remove = document.createElement("button");
    remove.className = "remove";
    remove.textContent = "Remove";
    remove.onclick = () => removeItem(item.id);

    line.append(info,remove);
    container.append(line);
  });

  document.getElementById("total").textContent =
    "Total: " + money(cartTotal());
}

function openCart(){
  renderCart();
  document.getElementById("cartModal").classList.add("show");
}

function closeCart(){
  document.getElementById("cartModal").classList.remove("show");
}

function removeItem(id){
  cart = cart.filter(item => item.id !== id);
  updateCount();
  renderCart();
}

function checkout(){
  if(cart.length === 0){
    alert("Your cart is empty. Add a product first!");
    return;
  }

  const preview = document.getElementById("preview");
  preview.replaceChildren();

  cart.forEach(item => {
    const line = document.createElement("p");
    line.textContent =
      `${item.name} × ${item.quantity}: ${money(item.price * item.quantity)}`;
    preview.append(line);
  });

  document.getElementById("previewTotal").textContent =
    "Total: " + money(cartTotal());

  closeCart();
  document.getElementById("checkoutModal").classList.add("show");
}

function closeCheckout(){
  document.getElementById("checkoutModal").classList.remove("show");
  openCart();
}

function finishOrder(){
  alert("Demo order confirmed! Thank you for shopping.");
  cart = [];
  updateCount();
  document.getElementById("checkoutModal").classList.remove("show");
  document.getElementById("message").textContent =
    "Demo order completed successfully!";
}

renderProducts();
</script>
</body>
</html>
